<script type="text/javascript">
function get_returnVal(){
	var aTR = get_TR('DEUDAS');
	var res = 'false';
	for (var i=0; i<aTR.length; i++){
		var seleccion = document.getElementById('OPCION_'+i).checked;
		
		if(seleccion == true){
			var vl_cod_deuda = document.getElementById('COD_DEUDA_H_'+i).value;
			var vl_rut = document.getElementById('RUT_H_'+i).value;
			res = 'true';
		}
	}
	
	if(res == 'true'){
		var ajax = nuevoAjax();
		ajax.open("GET", "ajax_seleccion_deuda.php?rut_deudor="+vl_rut+"&cod_deuda="+vl_cod_deuda, false);
		ajax.send(null);
		var resp = URLDecode(ajax.responseText);
		var lista = resp.split('|');
		return lista;	
	}else{
		alert('Debe Seleccionar una Deuda para continuar')
		return false;
	}
}
</script>

<body>
<form id="form1" name="form1" method="post" action="">
	<div class="titulo_tabla_wm">&nbsp;&nbsp;Seleccione la Deuda</div>
	<div style="overflow-x:hidden; overflow-y:auto; height:180; margin-top:-1em;">
		<table width="400" rules="none" border="1" align="center" class="table2">							
			<tr class="encabezado_right" align="center">
				<td align="center" width="25%">Seleccionar</td>
				<td align="center" width="30%">Cod Deuda</td>
				<td align="center" width="45%">Estado Deuda</td>
			</tr>
		</table>
		<table width="400" rules="none" border="1" align="center" class="table2" id="DEUDAS">
			<!-- startBlock(DEUDAS) -->
			<tr class="{DW_TR_CSS}" id="{DW_TR_ID}">
				<td align="center" width="25%">{REGISTROS}{OPCION}</td>
				<td align="right" width="30%">{RUT_H}{COD_DEUDA_H}{COD_DEUDA}</td>
				<td align="left" width="45%">{NOM_ESTADO_DEUDA}</td>
			</tr>
			<!-- endBlock(DEUDAS) -->
		</table>
	</div>
	<table width="400" border="0" align="center">
		<tr>
			<td align="right"><br/><input name="Aceptar" type="button" value="Aceptar" onclick="if(!(get_returnVal())) return false; else returnValue=get_returnVal();	window.close();" class="button"/></td>
			<td align="left"><br/><input name="cancelar" type="button" value="Cancelar" onclick="returnValue=null; window.close();" class="button"/></td>
		</tr>
