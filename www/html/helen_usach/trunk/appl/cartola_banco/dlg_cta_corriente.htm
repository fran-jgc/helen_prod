	var cod_cuenta = document.getElementById('COD_CUENTA_CORRIENTE_0').value;

		alert('Debe seleccionar una Cuenta Corriente.')

	}
	return true;
}

function get_returnVal() {
	var cod_cuenta = document.getElementById('COD_CUENTA_CORRIENTE_0').value;

	}
}
