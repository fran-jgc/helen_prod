<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Devolucion de Pagaré</title>
<link href="{W_CSS}" rel="stylesheet" type="text/css">
<script src="../../../../commonlib_seven/trunk/script_js/SpryTabbedPanels.js" type="text/javascript"></script>
<script charset="utf-8" src="{K_ROOT_URL}../../commonlib_seven/trunk/script_js/edit_filter.js" type="text/javascript"></script>
<script charset="utf-8" src="{K_ROOT_URL}../../commonlib_seven/trunk/script_js/general.js" type="text/javascript"></script>
<script type="text/javascript">
function get_returnVal() {
	var nom_dev = document.getElementById('NOM_DEV_0').value;
	var motivo = document.getElementById('MOTIVO_0').value;
	var rut_recibe = document.getElementById('RUT_RECIBE_0').value;
	var dig_verif = document.getElementById('DIG_VERIF_0').value;
	var rut = rut_recibe+'-'+dig_verif;
	var res = 	'';
	if(dig_verif == ''){
		alert('Debe ingresar el Rut correctamente con el dígito verificador');
		document.getElementById('RUT_RECIBE_0').focus();
		return false;
	}else if(nom_dev == ''){
		alert('Debe ingresar el Nombre del Receptor');
		document.getElementById('NOM_DEV_0').focus();
		return false;
	}else if(motivo ==''){
		alert('Debe Ingresar un Motivo de Devolución');
		document.getElementById('MOTIVO_0').focus();
		return false;
	
	}else{
		return nom_dev+'|'+rut+'|'+motivo;
	}
}</script>
<style type="text/css">
	.dig_verif{
		font-size: 12px;
		text-align:left;
	}
	.titulo{
		background-color: #E5E5E5;
		font-size: 12px;
		font-weight:bold;	
		color: #000066;
		text-align:right;
		padding-top:9px;
		margin-left:-5px;
		width:800px;
	}
</style>

</head>

<body class="content_wm">
<div>&nbsp;&nbsp;</div>
    <form action="" method="post" name="input" id="input"
	enctype="multipart/form-data">
        <table width="400" border="0" align="center">
        						<tr>
									<td class="titulo">Devolucion Pagare:</td>
								</tr>
								<tr>
									<td width="200" class="encabezado_right">Nombre Usuario:</td>
									<td width="200" class="oscuro">{USUARIO}{COD_USUARIO}</td>
								</tr>
								<tr>
									<td width="200" class="encabezado_right">Feha Devolución:</td>
									<td width="200" class="claro">{FECHA}</td>
								</tr>
								<tr>
									<td width="200" class="encabezado_right">Rut Receptor:</td>
									<td width="200" class="oscuro" align="left">{RUT_RECIBE}-{DIG_VERIF}</td>
								</tr>
								<tr>
									<td width="200" class="encabezado_right">Nombre Receptor:</td>
									<td width="200" class="oscuro">{NOM_DEV}{COD_ESTADO_PAGARE_H}</td>
								</tr>
								<tr>
									<td width="200" class="encabezado_right">Motivo:</td>
									<td width="200" class="claro">{MOTIVO}</td>
								</tr>
								<tr>
								<br>
								<br>
									<td align="right"><input name="Aceptar" type="submit" value="Aceptar" onclick="if(!(get_returnVal()))	return false; else returnValue=get_returnVal();	window.close();" class="button"/></td>
									<td align="left"><input name="cancelar" type="submit" value="Cancelar" onclick="returnValue=null; window.close();" class="button"/></td>
								</tr>
								
								<tr>
									<td colspan="2" align="right">
									  	
									</td>
									<td colspan="2" align="left">
									  	
									</td>								  				   
								</tr>
		</table>
    </form>
</body>
</html>
